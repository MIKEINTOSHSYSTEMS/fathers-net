# =============================================================================
# FathersNet CI/CD pipeline (implementation-plan/12 §5.2).
# Branch strategy (12 §5.1): feature/* -> develop (auto deploy staging) ->
# main (prod, behind manual approval gate).
#
# Secrets (NFR-022 / FR-170): all real keys live in GitHub repo secrets and are
# injected only in the deploy stage. Nothing is committed to the repo.
# =============================================================================
name: CI/CD

on:
  push:
    branches: [develop, main]
    tags: ['v*']
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: SAST (eslint-plugin-security)
        run: npm run sast

      - name: API contract lint (OpenAPI)
        run: npm run contract:lint

      - name: Dependency audit
        run: npm run audit

      - name: Secret scan
        run: npm run secret:scan

  staging:
    name: Deploy to staging (develop)
    if: github.ref == 'refs/heads/develop'
    needs: quality
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build and push images
        run: |
          echo "Image build/registry push for staging configured in IaC (M-01)."
          echo "Gateway image: gateway:${{ github.sha }}"
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}

  production:
    name: Deploy to production (main)
    if: github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Manual approval gate
        uses: trstringer/manual-approval@fa642940caf8412403569b28b2db4a1df08a83a3
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: ${{ vars.PROD_APPROVERS }}
      - name: Promote images
        run: |
          echo "Production promotion configured in IaC (M-01)."
          echo "Promoting gateway image: gateway:${{ github.sha }}"
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
