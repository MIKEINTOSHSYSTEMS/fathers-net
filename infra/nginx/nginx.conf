# =============================================================================
# FathersNet local development reverse proxy (nginx:1.27-alpine).
# TLS termination terminates here in deployment; local dev uses self-signed
# certs in infra/docker/certs (generate with scripts/update-certs.sh).
# =============================================================================

server {
    listen 80;
    server_name localhost;

    location /healthz {
        proxy_pass http://gateway:3000/healthz;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://gateway:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://gateway:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
